name: opengym

services:
  # One-time download of the exercise images and GIFs.
  media:
    image: alpine/git
    volumes:
      - ./media/img:/out/img
      - ./media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "Downloading exercise media (~140 MB, one time)..."
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/
          cp /tmp/ds/videos/*.gif /out/gif/
          echo "Exercise media ready ($$(ls /out/img | wc -l) images)."
        else
          echo "Exercise media already present - skipping download."
        fi
    restart: "no"

  # Passkey auth and per-user data. The API is reachable only through web.
  api:
    image: ${OPENGYM_IMAGE_NAMESPACE:-ghcr.io/duartesantos8}/opengym-api:${OPENGYM_IMAGE_TAG:-latest}
    build: ./apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      DATA_DIR: /data
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health').then((response) => {
          if (!response.ok) process.exit(1); }).catch(() => process.exit(1));
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Static frontend and same-origin /api proxy.
  web:
    image: ${OPENGYM_IMAGE_NAMESPACE:-ghcr.io/duartesantos8}/opengym-web:${OPENGYM_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s
